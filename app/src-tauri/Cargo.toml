[package]
name = "fastnlr-app"
version = "1.9.1"
edition = "2021"
authors = ["Jiwen Zhao (https://github.com/CropCoder)"]
license = "GPL-3.0-only"
repository = "https://github.com/CropCoder/FastNLR"
description = "FastNLR desktop application"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
nlr-service = { path = "../../crates/nlr-service" }
nlr-report = { path = "../../crates/nlr-report" }
fastnlr = { path = "../../crates/nlr-cli" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
