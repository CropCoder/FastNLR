[package]
name = "nlr-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

# User-facing binary name (the crate stays `nlr-cli` internally to avoid renaming imports).
[[bin]]
name = "fastnlr"
path = "src/main.rs"

[dependencies]
nlr-core = { path = "../nlr-core" }
nlr-config = { path = "../nlr-config" }
nlr-seq = { path = "../nlr-seq" }
nlr-scan = { path = "../nlr-scan" }
nlr-assemble = { path = "../nlr-assemble" }
nlr-output = { path = "../nlr-output" }
nlr-report = { path = "../nlr-report" }
nlr-plot = { path = "../nlr-plot" }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rayon = { workspace = true }
indicatif = { workspace = true }
ctrlc = { workspace = true }
tempfile = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
