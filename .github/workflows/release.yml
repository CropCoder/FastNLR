name: Release

on:
  push:
    tags:
      - "v[0-9]+.*"

permissions:
  contents: read

jobs:
  verify-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify manifest and tag versions
        run: node app/scripts/S1-Check-Versions-V1.mjs "${{ github.ref_name }}"

  create-release:
    runs-on: ubuntu-latest
    needs: verify-version
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/create-gh-release-action@v1

  upload-assets:
    name: ${{ matrix.target }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # 以 glibc 2.17 为基线构建，兼容 CentOS 7 / RHEL 8 / Debian 11 / Ubuntu 20.04 等旧发行版
          - target: x86_64-unknown-linux-gnu.2.17
            os: ubuntu-latest
            build-tool: cargo-zigbuild
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            build-tool: cargo
          - target: x86_64-apple-darwin
            os: macos-latest
            build-tool: cargo

    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/upload-rust-binary-action@v1
        with:
          bin: fastnlr
          target: ${{ matrix.target }}
          archive: $bin-$tag-$target
          tar: unix
          zip: windows
          build-tool: ${{ matrix.build-tool }}
          # checksum: sha256

      # 暂停发布 fastnlr-server（需要时取消注释即可恢复）
      # - uses: taiki-e/upload-rust-binary-action@v1
      #   with:
      #     bin: fastnlr-server
      #     target: ${{ matrix.target }}
      #     archive: $bin-$tag-$target
      #     tar: unix
      #     zip: windows
      #     build-tool: ${{ matrix.build-tool }}
      #     checksum: sha256

  gui-windows:
    name: Windows GUI NSIS
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Check release versions
        working-directory: app
        run: npm run check:versions -- "${{ github.ref_name }}"
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Build Windows installer
        working-directory: app
        run: npm run tauri build -- --bundles nsis
      - name: Prepare release files
        shell: pwsh
        run: |
          $installer = Get-ChildItem "app/src-tauri/target/release/bundle/nsis/*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }
          $version = "${{ github.ref_name }}".TrimStart("v")
          $releaseName = "FastNLR_${version}_x64-Windows-setup.exe"
          $releasePath = Join-Path $installer.Directory $releaseName
          Move-Item -LiteralPath $installer.FullName -Destination $releasePath -Force
          echo "INSTALLER=$releasePath" >> $env:GITHUB_ENV
      - name: Upload to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "$env:INSTALLER" --clobber

  gui-macos:
    name: macOS ARM64 GUI DMG
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Check release versions
        working-directory: app
        run: npm run check:versions -- "${{ github.ref_name }}"
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Build macOS installer
        working-directory: app
        env:
          APPLE_SIGNING_IDENTITY: "-"
        run: npm run tauri build -- --target aarch64-apple-darwin --bundles dmg
      - name: Verify ARM64 application
        run: |
          dmg=$(find app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          test -n "$dmg"
          mount_dir=$(mktemp -d /tmp/fastnlr-dmg.XXXXXX)
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir" >/dev/null
          trap 'hdiutil detach "$mount_dir" >/dev/null 2>&1 || true' EXIT
          app_binary=$(find "$mount_dir" -type f -path "*/Contents/MacOS/*" | head -1)
          test -f "$app_binary"
          lipo -info "$app_binary"
          hdiutil detach "$mount_dir" >/dev/null
          trap - EXIT
      - name: Prepare release files
        run: |
          cd app/src-tauri/target/aarch64-apple-darwin/release/bundle/dmg
          echo "DMG=$(realpath ./*.dmg)" >> "$GITHUB_ENV"
      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "$DMG" --clobber
